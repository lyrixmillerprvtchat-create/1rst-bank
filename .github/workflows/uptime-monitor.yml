name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site health
        id: health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://1rstbank.bauerdavis-systems.com/api/health)
          echo "http_status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "200" ]; then
            echo "Site is UP (HTTP $STATUS)"
          else
            echo "Site is DOWN (HTTP $STATUS)"
            exit 1
          fi
        continue-on-error: true

      - name: Send downtime alert email
        if: steps.health.outcome == 'failure'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY secret not set — skipping email"
            exit 0
          fi

          TIMESTAMP=$(date -u "+%B %d, %Y at %H:%M UTC")
          STATUS="${{ steps.health.outputs.http_status }}"

          HTML="<div style='font-family:sans-serif;max-width:520px;margin:auto;padding:24px;background:#f8fafc;border-radius:12px'><div style='background:linear-gradient(135deg,#dc2626,#991b1b);padding:24px;border-radius:10px;text-align:center;margin-bottom:24px'><h1 style='color:#fff;margin:0;font-size:22px'>&#x1F6A8; 1rst Bank is DOWN</h1></div><p style='color:#1e293b;font-weight:600;font-size:16px;margin:0 0 20px'>Your site stopped responding.</p><div style='background:#fff;border-radius:10px;padding:20px;border:1px solid #e2e8f0;margin-bottom:20px'><table style='width:100%;border-collapse:collapse'><tr><td style='color:#94a3b8;padding:6px 0;font-size:13px'>URL</td><td style='color:#1e293b;font-weight:600;text-align:right;font-size:13px'>1rstbank.bauerdavis-systems.com</td></tr><tr><td style='color:#94a3b8;padding:6px 0;font-size:13px'>HTTP Status</td><td style='color:#dc2626;font-weight:700;text-align:right;font-size:13px'>${STATUS}</td></tr><tr><td style='color:#94a3b8;padding:6px 0;font-size:13px'>Detected at</td><td style='color:#1e293b;font-weight:600;text-align:right;font-size:13px'>${TIMESTAMP}</td></tr></table></div><a href='https://vercel.com/lyrixmillerprvtchat-6304s-projects/1rst-bank/deployments' style='display:block;background:linear-gradient(135deg,#003087,#0066cc);color:#fff;text-decoration:none;text-align:center;padding:14px;border-radius:10px;font-weight:700;font-size:15px;margin-bottom:12px'>Open Vercel Dashboard</a><p style='color:#94a3b8;font-size:11px;text-align:center;margin-top:16px'>1rst Bank Uptime Monitor &mdash; alerts sent every 5 minutes while the site is down.</p></div>"

          jq -n \
            --arg from "1rst Bank Monitor <onboarding@resend.dev>" \
            --arg to "lyrixmillerprvtchat@gmail.com" \
            --arg subject "🚨 1rstbank.bauerdavis-systems.com is DOWN — ${TIMESTAMP}" \
            --arg html "$HTML" \
            '{"from":$from,"to":[$to],"subject":$subject,"html":$html}' | \
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @-

          echo "Downtime alert sent to lyrixmillerprvtchat@gmail.com"
